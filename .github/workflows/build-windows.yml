name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          python build.py

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ComandarServer.exe")) {
            Write-Error "ComandarServer.exe was not found in dist/"
            exit 1
          }
          Write-Host "ComandarServer.exe successfully created!"

      - name: Package release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "ComandarServer-Windows.zip" -Force
          Write-Host "Packaged into ComandarServer-Windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComandarServer-Windows
          path: |
            dist/ComandarServer.exe
            ComandarServer-Windows.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ComandarServer-Windows.zip
            dist/ComandarServer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
